[project]
name = "mdbridge"
version = "0.1.0"
description = "Stateless document to Markdown conversion service using MarkItDown"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "filetype>=1.2.0",
    "markitdown[pdf,docx,pptx,xlsx,xls,outlook]==0.1.8",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

